services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arc
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc
    ports:
      - "5432:5432"
    volumes:
      - arc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc -d arc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arc_postgres:

